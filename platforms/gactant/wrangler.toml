# gactant on Cloudflare. Deploy: npx wrangler deploy   (local use doesn't need any of this:
# node server.mjs)
name = "gactant"
main = "worker.mjs"
compatibility_date = "2025-09-01"

# The site, and the sandbox's own domain (a different site, so ludant code gets its own
# browser process). The Worker serves only the sandbox on gactantbox.com.
routes = [
  { pattern = "gactant.com", custom_domain = true },
  { pattern = "www.gactant.com", custom_domain = true },   # the Worker sends it on to gactant.com
  { pattern = "gactantbox.com", custom_domain = true },
]


# The workers.dev address is on only for checking a deploy (it answers /api/config alone).
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true   # so the Worker can add the sandbox's headers
html_handling = "none"    # serve sandbox.html as sandbox.html, not a redirect to /sandbox

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World"]

# Workers Logs: every request and every console line, kept 3 days (7 on a paid plan), in
# the dashboard under the Worker's Observability tab. The free plan stops logging past
# 200,000 a day rather than charging; on a paid plan, 20 million a month are included and a
# sampling rate under 1 caps it. ops.mjs keeps the long view (30 days) in the World itself.
[observability]
enabled = true
head_sampling_rate = 1

# The pictures (art and thumbs), served from the bucket's own custom domain so they pass
# through Cloudflare's cache, where the CSAM Scanning Tool sees them. Setting it up:
#   npx wrangler r2 bucket create gactant-art
#   npx wrangler r2 bucket domain add gactant-art --domain art.gactant.com --zone-id <gactant.com's>
#   npx wrangler r2 bucket cors set gactant-art --file r2-cors.json
[[r2_buckets]]
binding = "ART"
bucket_name = "gactant-art"

# Workers AI, for the look each publication gets before it goes public (check.mjs).
# Capped at 200 checks a day in core.mjs; a check is a few hundred neurons, and the
# free plan's 10,000 a day cover most days.
[ai]
binding = "AI"

# Which version is running, so the World can tell when it's older than the Worker.
[version_metadata]
binding = "VERSION"

# Hourly, for publications that haven't been checked yet.
[triggers]
crons = ["17 * * * *"]

[vars]
GACTANT_PUBLIC = "1"
SANDBOX_ORIGIN = "https://gactantbox.com"
ART_BASE = "https://art.gactant.com/"
