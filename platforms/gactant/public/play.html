<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gactant</title>
  <link rel="stylesheet" href="/css/gactant.css">
  <link rel="icon" href="/favicon.svg">
</head>
<body class="lobby">
  <main class="lobby-main"><p id="msg">taking a copy…</p></main>
  <script type="module">
    // A publication link takes a copy for this browser's person, then opens it. The copy
    // is remembered per publication, so coming back finds the same one.
    import { api, myName } from '/js/ui.js';
    const p = new URLSearchParams(location.search).get('p');
    const key = `gactant-copy-${p}`;
    let id = null;
    try { id = localStorage.getItem(key); } catch {}
    try {
      if (id) await api('GET', `ludants/${id}`).catch(() => { id = null; });
      if (!id) {
        const by = myName() || prompt('What should the ludants here call you?', '')?.trim() || 'someone';
        try { localStorage.setItem('gactant-name', by); } catch {}
        ({ id } = await api('POST', `published/${p}/copy`, { by }));
        try { localStorage.setItem(key, id); } catch {}
      }
      location.replace(`/frame.html?l=${id}`);
    } catch (err) { document.getElementById('msg').textContent = `couldn't take a copy: ${err.message}`; }
  </script>
</body>
</html>
