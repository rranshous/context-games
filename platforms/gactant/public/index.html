<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gactant</title>
  <link rel="stylesheet" href="/css/gactant.css">
  <link rel="icon" href="/favicon.svg">
</head>
<body class="lobby">
  <header class="top"><span class="brand">gactant</span><span class="tagline">ludants: games that are also actants</span><span class="spacer"></span><label class="me">you are <input id="me" placeholder="your name" maxlength="40"></label><span id="config"></span></header>
  <main class="lobby-main">
    <section>
      <h2>Published</h2>
      <p class="hint">Take a copy of one and it's yours: play it, ask it to change, publish it again.</p>
      <ul id="published" class="cards"></ul>
    </section>
    <section>
      <h2>Ludants here</h2>
      <p class="hint">Every one of these can be played and shaped. Some were seeded; some are copies.</p>
      <form id="seed" class="seed">
        <input id="seed-name" placeholder="name a new one to seed" required maxlength="40">
        <button>seed it</button>
      </form>
      <ul id="ludants" class="cards"></ul>
    </section>
  </main>
  <script type="module" src="/js/lobby.js"></script>
</body>
</html>
