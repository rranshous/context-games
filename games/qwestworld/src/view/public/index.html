<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwestworld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #efe6d2;
    --ink-dim: #b8ab8e;
    --panel: rgba(20, 17, 13, 0.82);
    --edge: rgba(214, 190, 140, 0.25);
    --gold: #d9b35f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1a26; color: var(--ink); font-family: 'EB Garamond', Georgia, serif; }
  canvas#world { position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: grab; display: block; }
  canvas#world.dragging { cursor: grabbing; }

  #hud { position: fixed; top: 16px; left: 20px; pointer-events: none; text-shadow: 0 1px 4px #000, 0 0 12px rgba(0,0,0,.6); }
  #hud h1 { font-family: Cinzel, serif; font-weight: 700; font-size: 26px; letter-spacing: .12em; margin: 0; color: var(--gold); }
  #hud .date { font-size: 20px; margin-top: 2px; }
  #hud .age { font-family: Cinzel, serif; font-size: 13px; letter-spacing: .2em; color: var(--ink-dim); }
  #hud .waiting { margin-top: 8px; font-style: italic; color: #f3d98b; opacity: 0; transition: opacity .6s; }
  #hud .waiting.on { opacity: 1; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }

  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 360px; max-width: 90vw; background: var(--panel); border-left: 1px solid var(--edge);
    backdrop-filter: blur(6px); display: flex; flex-direction: column; transition: transform .35s ease; }
  #panel.hidden { transform: translateX(100%); }
  #panel header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--edge);
    font-family: Cinzel, serif; letter-spacing: .15em; font-size: 13px; color: var(--ink-dim); }
  #panel button { font-family: Cinzel, serif; background: transparent; color: var(--gold); border: 1px solid var(--edge); border-radius: 3px;
    padding: 4px 10px; cursor: pointer; letter-spacing: .1em; font-size: 11px; }
  #panel button:hover { background: rgba(217,179,95,.12); }

  #kingdoms { padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 52vh; }
  .realm { border: 1px solid var(--edge); border-left: 4px solid var(--c); border-radius: 4px; padding: 8px 10px; cursor: pointer; background: rgba(255,255,255,.02); }
  .realm:hover { background: rgba(255,255,255,.05); }
  .realm.fallen { opacity: .4; }
  .realm .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .realm .name { font-family: Cinzel, serif; font-size: 14px; color: var(--c); }
  .realm .brain { font-size: 11px; letter-spacing: .08em; color: var(--ink-dim); border: 1px solid var(--edge); border-radius: 10px; padding: 0 7px; white-space: nowrap; }
  .realm .brain.mind { color: #9fd3c7; border-color: rgba(159,211,199,.4); }
  .realm .wars { font-size: 12px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
  .realm .war { color: var(--wc); }
  .realm .debt { color: #ff8a7a; }
  .realm .king { font-size: 14px; color: var(--ink-dim); }
  .realm .stats { font-size: 13px; margin-top: 2px; }
  .realm .thinking { color: #f3d98b; font-style: italic; font-size: 13px; animation: breathe 2s ease-in-out infinite; }
  .realm .decrees { font-size: 13px; color: var(--ink-dim); margin-top: 4px; }
  .realm .thought { font-size: 13px; font-style: italic; margin-top: 4px; color: #d8cfb9; }

  #tabs { display: flex; gap: 2px; padding: 8px 12px 6px; border-top: 1px solid var(--edge); }
  #panel #tabs button, #panel .metric button { border: none; border-bottom: 2px solid transparent; border-radius: 0; color: var(--ink-dim); padding: 4px 8px; }
  #panel #tabs button.on, #panel .metric button.on { color: var(--gold); border-bottom-color: var(--gold); background: transparent; }
  .pane { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
  .pane[hidden] { display: none; }
  #chronicle { font-size: 14px; line-height: 1.35; }
  #annals .annal { padding: 10px 0; border-bottom: 1px dotted rgba(214,190,140,.18); }
  #annals h3 { font-family: Cinzel, serif; font-size: 14px; letter-spacing: .12em; color: var(--gold); margin: 0 0 4px; }
  #annals p { margin: 0; font-size: 15px; line-height: 1.45; }
  #annals .by { font-size: 11px; color: var(--ink-dim); margin-top: 4px; font-style: italic; }
  .metric { display: flex; gap: 2px; margin: 4px 0 8px; }
  .metric button { font-size: 10px; }
  .empty { color: var(--ink-dim); font-style: italic; }
  #history-chart svg { display: block; font-family: 'EB Garamond', serif; }
  .chart-tip { position: absolute; pointer-events: none; background: rgba(20,17,13,.95); border: 1px solid var(--edge); border-radius: 4px; padding: 6px 8px; font-size: 12.5px; min-width: 130px; }
  .chart-tip .tip-date { color: var(--ink-dim); margin-bottom: 3px; }
  .chart-tip b { float: right; margin-left: 10px; font-weight: 600; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  #map-tip { position: fixed; pointer-events: none; background: rgba(20,17,13,.94); border: 1px solid var(--edge); border-radius: 4px; padding: 6px 9px; font-size: 13.5px; line-height: 1.35; z-index: 5; max-width: 260px; }
  #away { position: fixed; inset: 0; background: rgba(6,10,16,.72); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  #away[hidden] { display: none; }
  .away-card { background: #17130e; border: 1px solid var(--edge); border-radius: 6px; max-width: 640px; width: 100%; max-height: 86vh; display: flex; flex-direction: column; padding: 20px 22px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .away-card h2 { font-family: Cinzel, serif; letter-spacing: .16em; color: var(--gold); margin: 0; font-size: 20px; }
  .away-span { color: var(--ink-dim); margin: 4px 0 12px; font-style: italic; }
  .away-list { overflow-y: auto; flex: 1; font-size: 15px; line-height: 1.4; }
  .away-list div { padding: 4px 0; border-bottom: 1px dotted rgba(214,190,140,.14); }
  .away-list .when { color: var(--ink-dim); font-size: 12.5px; margin-right: 6px; }
  .away-card button { margin-top: 14px; align-self: center; font-family: Cinzel, serif; background: transparent; color: var(--gold); border: 1px solid var(--edge); border-radius: 3px; padding: 7px 16px; letter-spacing: .12em; cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink); margin-top: 8px; }
  #chronicle div { padding: 4px 0; border-bottom: 1px dotted rgba(214,190,140,.12); }
  #chronicle .when { color: var(--ink-dim); font-size: 12px; margin-right: 6px; }
  #chronicle .new { animation: flash 2s ease-out; }
  #chronicle .glyph { margin-right: 5px; }
  #chronicle .big { color: #f6e7c1; font-weight: 600; }
  #chronicle .speech { font-style: italic; color: #e3d6b4; }
  .realm .reign { margin-top: 6px; padding-top: 6px; border-top: 1px dotted var(--edge); font-size: 12.5px; color: #d8cfb9; max-height: 220px; overflow-y: auto; }
  .realm .reign div { padding: 2px 0; }
  .realm .reign .origin { color: var(--ink-dim); font-style: italic; }
  @keyframes flash { from { background: rgba(217,179,95,.25); } }

  #toggle { position: fixed; right: 12px; bottom: 12px; font-family: Cinzel, serif; font-size: 11px; color: var(--ink-dim); opacity: .6; pointer-events: none; }
  #error { position: fixed; left: 50%; top: 45%; transform: translate(-50%,-50%); font-size: 20px; font-style: italic; color: var(--ink-dim); text-align: center; }
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="hud">
  <h1>QWESTWORLD</h1>
  <div class="age" id="age"></div>
  <div class="date" id="date"></div>
  <div class="waiting" id="waiting"></div>
</div>
<aside id="panel">
  <header><span>THE REALMS</span><span><button id="pause">PAUSE</button> <button id="fit">FIT</button></span></header>
  <div id="kingdoms"></div>
  <div id="tabs"><button data-tab="chronicle" class="on">CHRONICLE</button><button data-tab="annals">ANNALS</button><button data-tab="history">HISTORY</button></div>
  <div id="chronicle" class="pane"></div>
  <div id="annals" class="pane" hidden></div>
  <div id="history" class="pane" hidden>
    <div class="metric"><button data-metric="held" class="on">TOWNS</button><button data-metric="soldiers">SOLDIERS</button></div>
    <div id="history-chart"></div>
  </div>
</aside>
<div id="toggle">H · panel &nbsp; F · fit &nbsp; drag · wheel</div>
<div id="error"></div>
<div id="away" hidden>
  <div class="away-card">
    <h2>WHILE YOU WERE AWAY</h2>
    <div class="away-span" id="away-span"></div>
    <div class="away-list" id="away-list"></div>
    <button id="away-close">RETURN TO THE WORLD</button>
  </div>
</div>
<script type="module" src="/dist/client/main.js"></script>
</body>
</html>
