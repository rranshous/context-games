<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Truenames vectors</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpolygon points=%2210,2 22,2 30,10 30,22 22,30 10,30 2,22 2,10%22 fill=%22none%22 stroke=%22%23e7c26b%22 stroke-width=%222.5%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%224%22 fill=%22%23e7c26b%22/%3E%3C/svg%3E" />
<style>body{background:#07060d;color:#e9dcb8;font:15px ui-monospace,monospace;padding:20px} .pass{color:#9fe0a0} .fail{color:#ff7a6b}</style></head>
<body><h1>Golden vectors in a browser Web Worker</h1><pre id="out">running…</pre>
<script type="module">
  import VectorsWorker from './src/vectors.worker.ts?worker';
  const w = new VectorsWorker();
  w.onmessage = (e) => {
    const { fails, ms } = e.data;
    const out = document.getElementById('out');
    out.className = fails.length ? 'fail' : 'pass';
    out.textContent = fails.length ? `FAIL (${fails.length})\n` + fails.join('\n') : `PASS: all spec v2 vectors match in a Web Worker (${ms.toFixed(0)} ms)`;
    document.title = fails.length ? 'FAIL' : 'PASS';
  };
</script></body></html>
