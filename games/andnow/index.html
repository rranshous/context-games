<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>andnow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0d12; color: #c9d1d9;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex; gap: 16px; padding: 16px; min-height: 100vh;
    }
    #stage { position: relative; }
    @media (max-width: 899px) {
      body { flex-direction: column; padding: 12px; }
      #side { width: auto; }
    }
    canvas { display: block; border: 1px solid #1f2633; background: #0b0d12; }
    #banner {
      position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
      background: #161b22ee; border: 1px solid #30363d; padding: 6px 14px; border-radius: 4px;
      display: none; font-size: 14px;
    }
    #tip {
      position: absolute; pointer-events: none; background: #161b22f0; border: 1px solid #30363d;
      padding: 4px 8px; border-radius: 3px; display: none; white-space: pre; font-size: 12px; z-index: 2;
    }
    #side { width: 340px; display: flex; flex-direction: column; gap: 12px; }
    h1 { font-size: 16px; color: #e6edf3; letter-spacing: 1px; }
    h1 small { color: #6e7681; font-weight: normal; font-size: 12px; }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    button, select, input {
      background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 3px;
      font: inherit; padding: 3px 8px;
    }
    button:hover { border-color: #58a6ff; cursor: pointer; }
    input[type=number] { width: 70px; }
    input[type=range] { width: 110px; padding: 0; }
    label { display: flex; gap: 4px; align-items: center; color: #8b949e; }
    .card { border: 1px solid #1f2633; border-left: 4px solid; padding: 6px 8px; border-radius: 3px; }
    .card.dead { opacity: 0.45; }
    .card .name { font-weight: bold; color: #e6edf3; }
    .card .stats { color: #8b949e; }
    .card .stack { color: #6e7681; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #log { height: 180px; overflow-y: auto; border: 1px solid #1f2633; padding: 4px 6px; font-size: 12px; color: #8b949e; }
    #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #tick { color: #6e7681; }
    .genome { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .genome code { color: #e6edf3; }
    #finder a { color: #58a6ff; cursor: pointer; text-decoration: none; }
    #finder div { margin: 2px 0; }
    #bakes { font-size: 12px; }
    #bakes a { display: flex; gap: 8px; color: #8b949e; cursor: pointer; text-decoration: none; padding: 2px 4px; border-radius: 3px; }
    #bakes a:hover { background: #161b22; }
    #bakes a.here { color: #e6edf3; background: #161b22; }
    #bakes .nm { color: #58a6ff; min-width: 70px; }
    #bakes .big { color: #ff6b8b; }
    #bakes .live { color: #3fb950; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="board"></canvas>
    <div id="banner"></div>
    <div id="tip"></div>
    <canvas id="minimap" style="display:none;position:absolute;top:0;right:-122px;cursor:pointer"></canvas>
    <canvas id="timeline" style="display:none;margin-top:6px;touch-action:none;cursor:pointer" title="tap or drag to jump to a tick"></canvas>
  </div>
  <div id="side">
    <h1>andnow <small>code-cloud warriors</small></h1>
    <div class="row" id="pickers"></div>
    <div class="row">
      <label>seed <input type="number" id="seed" value="1"></label>
      <button id="reset">New match</button>
      <button id="petri">Petri dish</button>
      <button id="island">Island</button>
      <button id="climb">Climb</button>
      <button id="share" title="Copy a link to this match at this tick">Copy link</button>
    </div>
    <div class="row">
      <button id="play">Play</button>
      <button id="step">Step</button>
      <label>speed <input type="range" id="speed" min="0" max="8" value="5" title="far right = as fast as it can go"></label>
      <span id="tick"></span>
    </div>
    <div class="row">
      <input type="number" id="goto" placeholder="go to tick" min="0" style="width:110px">
      <button id="go">Go</button>
    </div>
    <div id="finder" class="stats" style="display:none"></div>
    <div id="bakes" style="display:none"></div>
    <div class="row">
      <label><input type="checkbox" id="showIp" checked> show IPs</label>
      <label><input type="checkbox" id="showGlyphs"> glyphs</label>
    </div>
    <div class="row" id="zoom" style="display:none">
      <span style="color:#8b949e">zoom</span>
      <button id="zoomOut" title="zoom out (-)">&minus;</button>
      <button id="zoomIn" title="zoom in (+)">+</button>
    </div>
    <div id="dish" class="card" style="border-left-color:#e3b341"></div>
    <div id="cards"></div>
    <div id="log"></div>
  </div>
  <script type="module" src="./dist/main.js?v=13"></script>
</body>
</html>
