<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantle · design your army, then fight</title>
<meta name="description" content="A real-time strategy game where your army starts with nothing. Design every unit with your aid, a biologist or an engineer, then take them to war.">
<link rel="canonical" href="https://mantle.rip/">
<meta name="theme-color" content="#15171a">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mantle">
<meta property="og:title" content="Mantle · design your army, then fight">
<meta property="og:description" content="A real-time strategy game where your army starts with nothing. Design every unit with your aid, a biologist or an engineer, then take them to war.">
<meta property="og:url" content="https://mantle.rip/">
<meta property="og:image" content="https://mantle.rip/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>
<main id="title" class="screen" hidden>
  <div class="faces" aria-hidden="true"><img src="img/hollis.jpg" alt=""><img src="img/brackett.jpg" alt=""></div>
  <button class="knob menu" title="Menu"></button>
  <div class="mark">
    <h1>Mantle</h1>
    <p class="tagline">Design every unit in your army. Then take them to war.</p>
    <div id="title-go"></div>
    <p id="title-progress"></p>
  </div>
</main>

<main id="pick" class="screen" hidden>
  <header class="topbar">
    <button class="knob back" id="pick-back" title="Title screen"></button>
    <div class="where"><strong>Who will you work with?</strong><span>Every unit in your army is one you design together.</span></div>
    <button class="knob menu" title="Menu"></button>
  </header>
  <div id="aids"></div>
</main>

<main id="lab" class="screen" hidden>
  <header class="topbar">
    <button class="knob back" id="lab-back" title="Title screen"></button>
    <div class="where" id="who"></div>
    <button class="knob menu" title="Menu"></button>
  </header>

  <section id="talk" class="panel">
    <div id="log"></div>
    <form id="say">
      <textarea id="words" rows="2" placeholder="Describe a unit you want…"></textarea>
      <button class="plate" title="Say it (Enter)"></button>
    </form>
    <div id="need-thinking" hidden></div>
  </section>

  <section id="bench">
    <div id="specimen" class="panel">
      <div id="art"></div>
      <h2 id="name"></h2>
      <p id="description"></p>
    </div>
    <div id="sheet-panel" class="panel">
      <div id="sheet"></div>
      <div id="bench-actions">
        <button id="keep" class="plate" disabled>Keep this design</button>
        <button id="fresh" class="plate">Start a new one</button>
      </div>
    </div>
  </section>

  <footer class="actionbar">
    <div class="shelf"><h3>Your designs</h3><div id="kept"></div></div>
    <button id="front" class="main">To the front</button>
  </footer>
</main>

<main id="war" class="screen" hidden>
  <header class="topbar">
    <button class="knob back" id="to-lab" title="Back to the lab"></button>
    <div class="where"><strong>The front</strong><span id="war-where"></span></div>
    <button class="knob menu" title="Menu"></button>
  </header>
  <section id="maps" class="panel"></section>
  <section id="brief" class="panel"></section>
  <footer class="actionbar" id="muster"></footer>
</main>

<div id="menu" hidden></div>

<main id="match" hidden>
  <canvas id="field"></canvas>
  <div id="hud-top" class="panel">
    <span id="matter" class="stat" data-tip="Matter" data-about="What you make units with. Your base brings it in, and so does every deposit you hold and every gatherer at one."></span>
    <span id="supply" class="stat" data-tip="Room in the army" data-about="How much army you can field at once. Bigger units take more room."></span>
    <span id="clock" class="stat"></span>
  </div>
  <div id="hud-knobs">
    <button id="mute" class="knob" title="Sound"></button>
    <button id="speed" class="knob" title="Game speed"></button>
    <button id="pause" class="knob" title="Pause (P)"></button>
  </div>
  <div id="hud-orders">
    <button id="all-army" title="Pick your whole army (Q)"></button>
    <button id="box-mode" title="The next drag picks everything inside it"></button>
    <button id="order-mode" title="Fight: attack what's met on the way (A). Move: go there, whatever happens."></button>
    <button id="rally-mode" title="Where new units gather: tap the ground"></button>
  </div>
  <div id="picked"></div>
  <div id="mini-frame" class="panel"><canvas id="minimap"></canvas></div>
  <div id="toasts"></div>
  <div id="hud-make"><div id="makes"></div></div>
  <div id="overlay" hidden></div>
</main>
<script type="module" src="js/lab.js"></script>
</body>
</html>
