<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantle</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg">
</head>
<body>
<main id="pick" hidden>
  <h1>Mantle</h1>
  <p class="lede">Your army starts with nothing. Every unit in it is one you design, with the one person you work with. Who will it be?</p>
  <div id="aids"></div>
</main>

<main id="lab" hidden>
  <header>
    <h1>Mantle</h1>
    <span id="where"></span>
    <span id="thinking"></span>
    <button id="switch" class="quiet">work with someone else</button>
    <button id="front">To the front →</button>
  </header>

  <section id="talk">
    <div id="who"></div>
    <div id="log"></div>
    <form id="say">
      <textarea id="words" rows="2" placeholder="Describe a unit you want…"></textarea>
      <button>Say</button>
    </form>
  </section>

  <section id="bench">
    <div id="card">
      <div id="art"></div>
      <h2 id="name"></h2>
      <p id="description"></p>
    </div>
    <div id="sheet"></div>
    <div id="bench-actions">
      <button id="keep" disabled>Keep this design</button>
      <button id="fresh" class="quiet">Start a new one</button>
    </div>
  </section>

  <section id="roster">
    <h3>Your designs</h3>
    <div id="kept"></div>
  </section>
</main>
<main id="war" hidden>
  <header>
    <h1>Mantle</h1>
    <span class="where">the front</span>
    <button id="to-lab" class="quiet">← back to the lab</button>
  </header>
  <section id="maps"></section>
  <section id="brief"></section>
</main>

<main id="match" hidden>
  <canvas id="field"></canvas>
  <div id="hud-top">
    <span id="matter"></span><span id="supply"></span><span id="clock"></span>
    <button id="mute" class="quiet">sound on</button>
    <button id="speed" class="quiet">×1</button>
    <button id="pause">❚❚</button>
  </div>
  <div id="hud-orders">
    <button id="all-army">All army</button>
    <button id="box-mode">Box</button>
    <button id="order-mode">Fight</button>
    <button id="rally-mode">Rally</button>
  </div>
  <div id="picked"></div>
  <canvas id="minimap"></canvas>
  <div id="toasts"></div>
  <div id="hud-make"><div id="bays"></div><div id="makes"></div></div>
  <div id="overlay" hidden></div>
</main>
<script type="module" src="js/lab.js"></script>
</body>
</html>
