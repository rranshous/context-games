<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantle · design your army, then fight</title>
<meta name="description" content="A real-time strategy game where your army starts with nothing. Design every unit with your aid, a biologist or an engineer, then take them to war.">
<link rel="canonical" href="https://mantle.rip/">
<meta name="theme-color" content="#15171a">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mantle">
<meta property="og:title" content="Mantle · design your army, then fight">
<meta property="og:description" content="A real-time strategy game where your army starts with nothing. Design every unit with your aid, a biologist or an engineer, then take them to war.">
<meta property="og:url" content="https://mantle.rip/">
<meta property="og:image" content="https://mantle.rip/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>
<main id="title" hidden>
  <div class="faces" aria-hidden="true"><img src="img/hollis.jpg" alt=""><img src="img/brackett.jpg" alt=""></div>
  <div class="mark">
    <h1>Mantle</h1>
    <p class="tagline">Design every unit in your army. Then take them to war.</p>
    <div id="title-go"></div>
    <p id="title-progress"></p>
  </div>
  <footer class="site"><a href="/faq">FAQ</a> · <a href="/privacy">Privacy</a></footer>
</main>

<main id="pick" hidden>
  <button id="pick-back" class="quiet">← Mantle</button>
  <h1>Mantle</h1>
  <p class="lede">Your army starts with nothing. Every unit in it is one you design, with the one person you work with. Who will it be?</p>
  <div id="aids"></div>
  <footer class="site"><a href="/faq">FAQ</a> · <a href="/privacy">Privacy</a></footer>
</main>

<main id="lab" hidden>
  <header>
    <h1>Mantle</h1>
    <span id="where"></span>
    <span id="thinking"></span>
    <a class="quiet" href="/faq" target="_blank">FAQ</a>
    <button id="switch" class="quiet">work with someone else</button>
    <button id="front">To the front →</button>
  </header>

  <section id="talk">
    <div id="who"></div>
    <div id="log"></div>
    <form id="say">
      <textarea id="words" rows="2" placeholder="Describe a unit you want…"></textarea>
      <button>Say</button>
    </form>
  </section>

  <section id="bench">
    <div id="card">
      <div id="art"></div>
      <h2 id="name"></h2>
      <p id="description"></p>
    </div>
    <div id="sheet"></div>
    <div id="bench-actions">
      <button id="keep" disabled>Keep this design</button>
      <button id="fresh" class="quiet">Start a new one</button>
    </div>
  </section>

  <section id="roster">
    <h3>Your designs</h3>
    <div id="kept"></div>
  </section>
</main>
<main id="war" hidden>
  <header>
    <h1>Mantle</h1>
    <span class="where">the front</span>
    <button id="to-lab" class="quiet">← back to the lab</button>
  </header>
  <section id="maps"></section>
  <section id="brief"></section>
</main>

<main id="match" hidden>
  <canvas id="field"></canvas>
  <div id="hud-top">
    <span id="matter" class="stat" data-tip="Matter" data-about="What you make units with. Your base brings it in, and so does every deposit you hold and every gatherer at one."></span>
    <span id="supply" class="stat" data-tip="Room in the army" data-about="How much army you can field at once. Bigger units take more room."></span>
    <span class="spacer"></span>
    <span id="clock" class="stat"></span>
    <button id="mute" class="quiet" title="Sound"></button>
    <button id="speed" class="quiet" title="Game speed"></button>
    <button id="pause" title="Pause (P)"></button>
  </div>
  <div id="hud-orders">
    <button id="all-army" title="Pick your whole army (Q)"></button>
    <button id="box-mode" title="The next drag picks everything inside it"></button>
    <button id="order-mode" title="Fight: attack what's met on the way (A). Move: go there, whatever happens."></button>
    <button id="rally-mode" title="Where new units gather: tap the ground"></button>
  </div>
  <div id="picked"></div>
  <canvas id="minimap"></canvas>
  <div id="toasts"></div>
  <div id="hud-make"><div id="makes"></div></div>
  <div id="overlay" hidden></div>
</main>
<script type="module" src="js/lab.js"></script>
</body>
</html>
